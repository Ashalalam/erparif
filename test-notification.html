<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Notifications - BillSprout</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 32px;
    }
    h1 { font-size: 24px; color: #1a202c; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-weight: 600;
      color: #374151;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
    }
    button:active { transform: translateY(0); }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .result.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    .result.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .result.show { display: block; }
    pre {
      background: #f9fafb;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 8px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📧 Test Notification System</h1>
    <p>Send test email/SMS notifications to verify your configuration</p>

    <form id="notificationForm">
      <div class="form-group">
        <label for="eventType">Event Type</label>
        <select id="eventType" required>
          <option value="order_confirmed">Order Confirmed</option>
          <option value="order_processing">Order Processing</option>
          <option value="order_ready">Order Ready</option>
          <option value="order_delivered">Order Delivered</option>
          <option value="order_cancelled">Order Cancelled</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="customer@example.com" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number (with country code)</label>
        <input type="tel" id="phone" placeholder="+91 98765 43210" />
      </div>

      <div class="form-group">
        <label for="orderNumber">Order Number</label>
        <input type="text" id="orderNumber" value="ORD-12345" required />
      </div>

      <div class="form-group">
        <label for="amount">Total Amount (₹)</label>
        <input type="number" id="amount" value="1250.00" step="0.01" required />
      </div>

      <button type="submit" id="submitBtn">
        Send Test Notification
      </button>
    </form>

    <div id="result" class="result"></div>
  </div>

  <script type="module">
    import { sendEmail, sendSMS } from './src/services/notificationService.js'

    const form = document.getElementById('notificationForm')
    const submitBtn = document.getElementById('submitBtn')
    const resultDiv = document.getElementById('result')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      
      const eventType = document.getElementById('eventType').value
      const email = document.getElementById('email').value
      const phone = document.getElementById('phone').value
      const orderNumber = document.getElementById('orderNumber').value
      const amount = document.getElementById('amount').value

      submitBtn.disabled = true
      submitBtn.textContent = 'Sending...'
      resultDiv.className = 'result'
      resultDiv.textContent = ''

      const orderData = {
        order_number: orderNumber,
        customer_name: 'Test Customer',
        total_amount: amount,
        payment_method: 'Online Payment',
        order_date: new Date().toLocaleDateString('en-IN'),
        order_tracking_url: window.location.origin + '/customer/orders/test',
        pharmacy_address: 'Test Pharmacy Address',
        estimated_delivery: 'Tomorrow',
        delivered_date: new Date().toLocaleDateString('en-IN'),
        cancellation_reason: 'Test cancellation',
        refund_amount: amount,
        delivery_or_pickup_info: 'Test delivery info',
        refund_info: `Refund of ₹${amount} will be processed.`
      }

      const results = {}

      // Send Email
      if (email) {
        const subject = `Test: ${eventType.replace(/_/g, ' ').toUpperCase()} - Order #${orderNumber}`
        const html = `
          <div style="font-family: Arial, sans-serif; padding: 20px;">
            <h2>Test Notification: ${eventType}</h2>
            <p><strong>Order Number:</strong> ${orderNumber}</p>
            <p><strong>Amount:</strong> ₹${amount}</p>
            <p><strong>Event:</strong> ${eventType.replace(/_/g, ' ')}</p>
            <hr>
            <p style="color: #666; font-size: 12px;">
              This is a test email from BillSprout notification system.
            </p>
          </div>
        `

        results.email = await sendEmail({
          to: email,
          subject,
          html,
          customerId: 'test-user',
          orderId: 'test-order',
          eventType
        })
      }

      // Send SMS
      if (phone) {
        const message = `BillSprout TEST: Order #${orderNumber} - ${eventType.replace(/_/g, ' ')}. Amount: ₹${amount}. This is a test message.`

        results.sms = await sendSMS({
          to: phone,
          message,
          customerId: 'test-user',
          orderId: 'test-order',
          eventType
        })
      }

      // Show results
      const hasSuccess = Object.values(results).some(r => r.success)
      const hasError = Object.values(results).some(r => !r.success)

      if (hasSuccess && !hasError) {
        resultDiv.className = 'result success show'
        resultDiv.innerHTML = `
          <strong>✅ Success!</strong>
          <pre>${JSON.stringify(results, null, 2)}</pre>
        `
      } else if (hasError) {
        resultDiv.className = 'result error show'
        resultDiv.innerHTML = `
          <strong>❌ Error</strong>
          <pre>${JSON.stringify(results, null, 2)}</pre>
        `
      }

      submitBtn.disabled = false
      submitBtn.textContent = 'Send Test Notification'
    })
  </script>
</body>
</html>
